<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#4facfe" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0d1b2a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="140" fill="#0d1b2a" />
  <rect width="510" height="510" x="1" y="1" rx="139" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="230" r="180" fill="url(#glow)" />

  <!-- Mortarboard Top -->
  <polygon points="256,110 430,185 256,260 82,185" fill="url(#primaryGradient)" />
  <polyline points="82,185 256,110 430,185" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="4" />

  <!-- Skullcap -->
  <path d="M 150,225 C 150,290 362,290 362,225 C 330,310 182,310 150,225 Z" fill="url(#primaryGradient)" />

  <!-- Tassel -->
  <polyline points="256,185 400,215 405,280" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <ellipse cx="405" cy="288" rx="8" ry="12" fill="#ffffff" />

  <!-- Center Button -->
  <circle cx="256" cy="185" r="9" fill="#ffffff" />

  <!-- Brand Typography -->
  <text x="256" y="415" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="68" font-weight="800" fill="#ffffff" letter-spacing="2">UniTRS</text>
  <rect x="176" y="434" width="160" height="4" rx="2" fill="url(#primaryGradient)" />
</svg>
